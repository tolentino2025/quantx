version: "3.9"

# ── QuantX — Docker Compose (desenvolvimento local) ──────────────────────────
# Banco e Storage: Supabase (externo). Configure .env com:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL
#
# Para produção real use RunPod GPU para o serviço ml.

services:
  # ── infraestrutura ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── serviço ML (Python / FastAPI) ─────────────────────────────────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODEL_DIR: /models
      SUPABASE_URL:              ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
    volumes:
      - model_weights:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── backend API + worker (Node.js) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:                  production
      PORT:                      3000
      HOST:                      0.0.0.0
      REDIS_URL:                 redis://redis:6379
      ML_BASE_URL:               http://ml:8000
      DATABASE_URL:              ${DATABASE_URL:?DATABASE_URL is required}
      SUPABASE_URL:              ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      MODEL_VERSION:             ${MODEL_VERSION:-yolov15-spci-2026.04}
      RENDER_DPI:                ${RENDER_DPI:-150}
    volumes:
      - telemetry:/tmp/quantx-telemetry
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  redis_data:
  model_weights:
  telemetry:
